[project]
name = "flync-autosar-mapping"
version = "1.0.0"
description = "Deterministic forward and reverse mapping between FLYNC models and AUTOSAR ARXML evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-extra-types>=2.11.0,<3.0.0",
    "pyyaml==6.0.3",
    "rich>=14.0,<15.0",
    "semver>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flync*"]

[tool.setuptools.package-data]
flync = ["py.typed"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
